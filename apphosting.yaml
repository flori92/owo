# Configuration Firebase App Hosting pour owo!
# https://firebase.google.com/docs/app-hosting/configure

# Chemin vers l'application web dans le monorepo
rootDirectory: apps/web

runConfig:
  # Ressources CPU et mémoire
  cpu: 1
  memoryMiB: 512
  
  # Nombre d'instances
  minInstances: 0
  maxInstances: 10
  
  # Concurrence par instance
  concurrency: 80

env:
  # Variables d'environnement pour le build et le runtime
  # Ces valeurs doivent être configurées via Firebase App Hosting secrets
  # Voir: https://firebase.google.com/docs/app-hosting/configure#secrets
  - variable: VITE_FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: VITE_FIREBASE_API_KEY
    secret: FIREBASE_API_KEY
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    secret: FIREBASE_AUTH_DOMAIN
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    secret: FIREBASE_MESSAGING_SENDER_ID
  - variable: VITE_FIREBASE_APP_ID
    secret: FIREBASE_APP_ID
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    secret: FIREBASE_MEASUREMENT_ID
